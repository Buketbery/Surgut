:root{
  --bg:#382426;
  --accent:#C1C77D;
  --text:#F4F2E6;
  --pr:#6C7440;
  --dk:#414429;
  --rose:#E1A8AF;
  --mute:rgba(244,242,230,.7);
  --card:rgba(244,242,230,.06);
  --line:rgba(244,242,230,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.wrap{
  position:relative;overflow:hidden;
  max-width:560px;margin:0 auto;
  padding:calc(40px + env(safe-area-inset-top)) 22px calc(36px + env(safe-area-inset-bottom));
}
.wrap::before{
  content:"";position:absolute;right:-90px;top:-90px;width:240px;height:240px;
  border-radius:50%;background:rgba(118,81,88,.5);pointer-events:none;
}
.wrap::after{
  content:"";position:absolute;right:-45px;top:-45px;width:150px;height:150px;
  border-radius:50%;border:1.5px solid rgba(193,199,125,.5);pointer-events:none;
}
.wrap > *{position:relative;z-index:1}
.wrap > .logo{position:absolute;right:22px;top:calc(30px + env(safe-area-inset-top));width:120px;height:auto;z-index:2;pointer-events:none}
.eyebrow{
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin:0 0 16px;
}
h1{
  font-family:'Jost','Arial Black',sans-serif;font-weight:700;
  font-size:40px;line-height:1.05;letter-spacing:-.01em;
  margin:0 0 16px;white-space:pre-line;
}
.desc{font-size:16px;color:var(--mute);margin:0 0 36px;max-width:420px}
.hero{
  background:var(--accent);color:var(--bg);
  border-radius:24px;padding:28px 24px;margin:0 0 36px;
}
.hero h2{
  font-family:'Jost','Arial Black',sans-serif;font-weight:700;
  font-size:26px;line-height:1.1;margin:0 0 12px;
}
.hero p{margin:0 0 22px;font-size:16px;font-weight:600}
.btn{
  display:inline-block;background:var(--bg);color:var(--text);
  text-decoration:none;font-weight:600;font-size:16px;
  padding:16px 28px;border-radius:999px;
}
.list{display:flex;flex-direction:column;gap:12px}
.card{
  display:flex;align-items:center;gap:16px;
  background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:20px;text-decoration:none;color:inherit;
  transition:border-color .15s,transform .15s;
}
.card:active{transform:scale(.98);border-color:var(--accent)}
.num{
  font-family:'Jost',sans-serif;font-weight:700;
  font-size:15px;color:var(--accent);min-width:28px;
}
.body{flex:1;min-width:0}
.ct{
  font-family:'Jost',sans-serif;font-weight:700;
  font-size:19px;line-height:1.15;margin:0 0 4px;
}
.cc{font-size:13px;color:var(--mute);margin:0}
.arrow{font-size:22px;color:var(--accent);flex-shrink:0}
.footer{
  margin-top:48px;padding-top:24px;border-top:1px solid var(--line);
  font-size:14px;color:var(--mute);
}
.footer b{
  font-family:'Jost',sans-serif;font-weight:700;font-size:18px;
  color:var(--text);display:block;margin-bottom:2px;
}
</style>
</head>

    return e;
  }
  function link(url, cls) {
    var a = el("a", cls);
    a.href = url;
    a.setAttribute("data-url", url);
    a.target = inTelegram ? "_self" : "_blank";
    if (!inTelegram) a.rel = "noopener";
    return a;
  }

  var app = document.getElementById("app");
  if (window.KK_LOGO) {
    var logo = el("img", "logo");
    logo.src = window.KK_LOGO;
    logo.alt = "Букетбери";
    app.appendChild(logo);
  }
  app.appendChild(el("p", "eyebrow", D.eyebrow));
  app.appendChild(el("h1", null, D.title));
  app.appendChild(el("p", "desc", D.description));

  var hero = el("section", "hero");
  hero.appendChild(el("h2", null, D.cta.title));
  hero.appendChild(el("p", null, D.cta.text));
  var b = link(D.cta.url, "btn");
  b.textContent = D.cta.button;
  hero.appendChild(b);
  app.appendChild(hero);

  var list = el("div", "list");
  D.cards.forEach(function (c, i) {
    var a = link(c.url, "card");
    a.appendChild(el("span", "num", String(i + 1).padStart(2, "0")));
    var body = el("div", "body");
    body.appendChild(el("p", "ct", c.title));
    body.appendChild(el("p", "cc", c.caption));
    a.appendChild(body);
    a.appendChild(el("span", "arrow", "\u2192"));
    list.appendChild(a);
  });
  app.appendChild(list);

  var f = el("footer", "footer");
  f.appendChild(el("b", null, D.footer.name));
  if (D.footer.school) f.appendChild(el("span", null, D.footer.school));
  app.appendChild(f);

  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.setHeaderColor && tg.setHeaderColor(D.bg); } catch (e) {}
    try { tg.setBackgroundColor && tg.setBackgroundColor(D.bg); } catch (e) {}
  }

  function isMaxLink(url) { return url.indexOf("https://max.ru/") === 0; }

  function openUrl(url) {
    try {
      if (tg && isMaxLink(url) && tg.openMaxLink) { tg.openMaxLink(url); return; }
      if (tg && tg.openLink) { tg.openLink(url); return; }
    } catch (e) {}
    window.open(url, "_blank");
  }

  document.addEventListener("click", function (e) {
    if (!inTelegram) return;
    var a = e.target.closest && e.target.closest("a[data-url]");
    if (!a) return;
    e.preventDefault();
    openUrl(a.getAttribute("data-url"));
  });
})();
</script>
</body>
</html>
